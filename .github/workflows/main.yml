
name: Build Ambiorix Pay APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "::error::No se encontró settings.gradle o settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró la carpeta app en $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::No se encontró el archivo Gradle del módulo app"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android: $PROJECT_DIR"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

          /tmp/gradle-8.9/bin/gradle --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::No se encontró Android SDK en $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
